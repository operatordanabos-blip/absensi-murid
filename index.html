function order(d){

  const same=(x,y)=>x.length===y.length&&x.every((v,i)=>v===y[i]);

  try{const v=localStorage.getItem(KEY);if(v)return mig(JSON.parse(v))}catch(e){}return mig(m||seed())}
const SKEY='presensi_sdn_session';
const getSess=()=>{try{return JSON.parse(sessionStorage.getItem(SKEY))}catch(e){return null}};
const waNum=n=>{n=String(n||'').replace(/\D/g,'');return n.startsWith('0')?'62'+n.slice(1):n.startsWith('8')?'62'+n:n};
const TPL='Assalamualaikum Bapak/Ibu {orangtua}. Kami dari {sekolah} menginformasikan bahwa ananda {nama} ({kelas}) pada {tanggal} berstatus *{status}*. Mohon konfirmasi. Terima kasih.';

// ===================== FACE ID (face-api, berjalan di perangkat) =====================
// Pustaka & model dimuat dari CDN saat pertama dipakai, lalu disimpan di cache oleh service worker.
// Untuk memakai file sendiri (tanpa CDN), salin folder "model" ke hosting dan ubah FACE_MODELS ke './model/'.
const FACE_LIB='https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.13/dist/face-api.js';
const FACE_MODELS='https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.13/model/';
let facePromise=null;
function loadFace(){
  if(facePromise)return facePromise;
  facePromise=(async()=>{
    if(typeof faceapi==='undefined'){
      await new Promise((ok,no)=>{const s=document.createElement('script');s.src=FACE_LIB;s.onload=ok;s.onerror=()=>{s.remove();no(new Error('lib'))};document.head.appendChild(s)})}
    try{await faceapi.tf.setBackend('webgl')}catch(e){}
    await faceapi.tf.ready();
    await Promise.all([faceapi.nets.tinyFaceDetector.loadFromUri(FACE_MODELS),faceapi.nets.faceLandmark68Net.loadFromUri(FACE_MODELS),faceapi.nets.faceRecognitionNet.loadFromUri(FACE_MODELS)]);
    return true})();
  facePromise.catch(()=>{facePromise=null});
  return facePromise}
function useFaceLib(){
  const [st,setSt]=useState('loading');const [n,setN]=useState(0);
  useEffect(()=>{let live=true;setSt('loading');loadFace().then(()=>live&&setSt('ready')).catch(()=>live&&setSt('error'));return()=>{live=false}},[n]);
  return [st,()=>setN(x=>x+1)]}

// Data wajah disimpan sebagai teks angka (bukan foto): beberapa sampel dipisah "|", tiap sampel 128 angka.
const serFace=ds=>ds.map(d=>Array.from(d).map(x=>+x.toFixed(4)).join(',')).join('|');
const parseFace=str=>{try{return String(str||'').split('|').filter(Boolean).map(p=>Float32Array.from(p.split(',').map(Number))).filter(a=>a.length===128)}catch(e){return[]}};
const fdist=(a,b)=>{let s=0;for(let i=0;i<128;i++){const d=a[i]-b[i];s+=d*d}return Math.sqrt(s)};
// Cocokkan satu wajah dengan seluruh murid. Ditolak bila terlalu jauh atau terlalu mirip dengan murid lain.
function matchFace(desc,roster,th){
  let b1=9,b2=9,bi=null;
  for(const r of roster){let m=9;for(const d of r.ds){const x=fdist(desc,d);if(x<m)m=x}
    if(m<b1){b2=b1;b1=m;bi=r}else if(m<b2)b2=m}
  if(!bi||b1>th)return null;
  if(roster.length>1&&b2-b1<0.04)return null;
  return{r:bi,d:b1}}
const camMsg=er=>{const nm=(er&&er.name)||'';
  if(nm==='NotAllowedError'||nm==='SecurityError')return 'Izin kamera ditolak. Klik ikon gembok di address bar, pilih Izinkan Kamera, lalu nyalakan lagi.';
  if(nm==='NotFoundError'||nm==='DevicesNotFoundError')return 'Kamera tidak ditemukan di perangkat ini.';
  if(nm==='NotReadableError'||nm==='TrackStartError')return 'Kamera sedang dipakai aplikasi lain. Tutup aplikasi itu lalu coba lagi.';
  if(!window.isSecureContext)return 'Kamera hanya bisa dibuka lewat HTTPS.';
  return 'Kamera tidak dapat dibuka ('+(nm||'tidak didukung')+').'};
function useCamera(on,facing,onErr){
  const vid=useRef(null);const [ready,setReady]=useState(false);
  useEffect(()=>{if(!on){setReady(false);return}let stop=false,stream=null;
    if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){onErr({name:'tidak didukung'});return}
    navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:facing},width:{ideal:960},height:{ideal:720}},audio:false}).then(m=>{
      if(stop){m.getTracks().forEach(t=>t.stop());return}
      const v=vid.current;if(!v){m.getTracks().forEach(t=>t.stop());return}
      stream=m;v.srcObject=m;v.setAttribute('playsinline','');v.muted=true;v.play().catch(()=>{});setReady(true)
    }).catch(e=>{if(!stop)onErr(e)});
    return()=>{stop=true;setReady(false);stream&&stream.getTracks().forEach(t=>t.stop())}},[on,facing]);
  return{vid,ready}}
const FaceStatus=({lib,retry})=>lib==='loading'?<span>Memuat pengenal wajah… (pertama kali butuh internet, ±7 MB)</span>:lib==='error'?<span className="text-red-600">Pengenal wajah gagal dimuat. Periksa internet. <button className="underline" onClick={retry}>Coba lagi</button></span>:null;

function Scan({db,setAtt,setJam,toast}){
  const ovl=useRef(null);const ft=useRef(0);const aud=useRef(null);const last=useRef({});const mk=useRef();const ms=useRef();const roster=useRef([]);
  const [auto,setAuto]=useState(()=>{try{return localStorage.getItem('sdn_scan_auto')!=='0'}catch(e){return true}});
  const [on,setOn]=useState(auto);const [fm,setFm]=useState('user');const [md,setMd]=useState(()=>nowHM()>=(db.classes.map(k=>jpOf(db,k.id)).sort()[0]||'12:00')?'pulang':'masuk');const [log,setLog]=useState([]);const [man,setMan]=useState('');const [st2,setSt2]=useState('');const [fb,setFb]=useState(null);
  const [lib,retry]=useFaceLib();
  const th=Math.min(.7,Math.max(.3,parseFloat(db.school.faceTh)||.5));
  const ros=useMemo(()=>db.students.map(s=>({s,ds:parseFace(s.face)})).filter(r=>r.ds.length),[db.students]);
  roster.current=ros;
  const {vid,ready}=useCamera(on,fm,er=>{setSt2(camMsg(er));toast(camMsg(er));setOn(false)});
  const beep=ok=>{try{const AC=window.AudioContext||window.webkitAudioContext;if(AC){const a=aud.current||(aud.current=new AC());if(a.resume)a.resume();const o=a.createOscillator(),g=a.createGain();o.connect(g);g.connect(a.destination);o.frequency.value=ok?880:220;g.gain.value=.15;o.start();o.stop(a.currentTime+(ok?.12:.28))}}catch(e){}
    try{navigator.vibrate&&navigator.vibrate(ok?60:[80,60,80])}catch(e){}};
  const flash=(c,msg)=>{setFb({c,msg});clearTimeout(ft.current);ft.current=setTimeout(()=>setFb(null),1800)};
  const mark=(s)=>{const t=Date.now();const ck=s.id+md;if(last.current[ck]&&t-last.current[ck]<6000)return;last.current[ck]=t;
    const d=new Date(),k=iso(d)+'|'+s.id,cur=db.att[k],j=(db.jam||{})[k]||{},hm=nowHM();
    if(md==='pulang'){
      if(cur!=='H'&&cur!=='T'){beep(false);flash('#dc2626','✖ '+s.name+(cur?' · berstatus '+ST[cur].l+', tidak perlu presensi pulang':' · belum presensi datang'));return}
      if(j.p){flash('#2563eb','✔ '+s.name+' · sudah pulang pukul '+j.p);return}
      const early=hm<jpOf(db,s.classId);
      setJam([[k,{p:hm}]]);setLog(l=>[{s,hm,pl:true,early},...l].slice(0,8));beep(true);flash(early?'#d97706':'#16a34a','✔ '+s.name+' · Pulang '+hm+(early?' (lebih awal)':''));toast(s.name+' · Pulang '+hm+(early?' (lebih awal)':''));return}
    if(cur&&cur!=='A'){flash('#2563eb','✔ '+s.name+' · sudah tercatat '+ST[cur].l);return}
    const st=hm>(db.school.jamMasuk||'07:30')?'T':'H';
    setAtt([[k,st]]);setJam([[k,{m:hm}]]);setLog(l=>[{s,st,hm},...l].slice(0,8));beep(true);flash('#16a34a','✔ '+s.name+' · '+ST[st].l);toast(s.name+' · '+ST[st].l)};
  mk.current=mark;
  ms.current=()=>{const t=Date.now();if(last.current['?']&&t-last.current['?']<4000)return;last.current['?']=t;beep(false);flash('#dc2626','✖ Wajah tidak dikenal')};
  const manual=()=>{const raw=man.trim();setMan('');if(!raw)return;const s=db.students.find(x=>String(x.nis).trim()===raw);if(!s){beep(false);toast('NIS tidak ditemukan: '+raw.slice(0,30));return}mark(s)};
  useEffect(()=>{if(!on||!ready||lib!=='ready')return;let stop=false,timer=0,unk=0;const cand={};
    const opts=new faceapi.TinyFaceDetectorOptions({inputSize:416,scoreThreshold:.5});
    const draw=(items,vw,vh)=>{const o=ovl.current;if(!o)return;const W=o.clientWidth,H=o.clientHeight;if(!W||!H)return;o.width=W;o.height=H;
      const k=Math.max(W/vw,H/vh),dx=(W-vw*k)/2,dy=(H-vh*k)/2,c=o.getContext('2d');c.clearRect(0,0,W,H);c.lineWidth=3;c.font='600 14px system-ui,sans-serif';
      items.forEach(it=>{const b=it.box;let x=b.x*k+dx;const y=b.y*k+dy,w=b.width*k,h=b.height*k;if(fm==='user')x=W-x-w;
        const col=it.ok===true?'#22c55e':it.ok===false?'#ef4444':'#f59e0b';c.strokeStyle=col;c.strokeRect(x,y,w,h);
        const tw=c.measureText(it.label).width+12,ty=y>26?y-24:y+h+2;c.fillStyle=col;c.fillRect(x,ty,tw,22);c.fillStyle='#fff';c.fillText(it.label,x+6,ty+16)})};
    const tick=async()=>{if(stop)return;const v=vid.current;
      if(v&&v.videoWidth&&v.readyState>=2&&!document.hidden){try{
        const vw=v.videoWidth,vh=v.videoHeight;
        let res=await faceapi.detectAllFaces(v,opts).withFaceLandmarks().withFaceDescriptors();
        if(stop)return;
        res=res.sort((a,b)=>b.detection.box.width-a.detection.box.width).slice(0,3);
        const items=[],now=Date.now();let anyUnk=false;
        for(const r of res){const b=r.detection.box;
          if(b.width<vw*.14){items.push({box:b,label:'Dekatkan wajah',ok:null});continue}
          const m=matchFace(r.descriptor,roster.current,th);
          if(m){const id=m.r.s.id;const n=cand[id]&&now-cand[id].t<1500?cand[id].n+1:1;cand[id]={n,t:now};items.push({box:b,label:m.r.s.name,ok:true});if(n>=2)mk.current(m.r.s)}
          else{anyUnk=true;items.push({box:b,label:'Tidak dikenal',ok:false})}}
        unk=anyUnk?unk+1:0;if(unk>=4){unk=0;ms.current()}
        draw(items,vw,vh)
      }catch(x){}}
      if(!stop)timer=setTimeout(tick,120)};
    setSt2('Pemindai aktif: hadapkan wajah ke kamera (jarak ±50 cm). Murid dicatat otomatis.');tick();
    return()=>{stop=true;clearTimeout(timer);clearTimeout(ft.current);const o=ovl.current;if(o)o.getContext('2d').clearRect(0,0,o.width,o.height)}},[on,ready,lib,fm,th]);
  const setAutoP=e=>{const v=e.target.checked;setAuto(v);try{localStorage.setItem('sdn_scan_auto',v?'1':'0')}catch(x){}};
  const regd=ros.length,tot=db.students.length;
  return <div className="space-y-4"><h1 className="text-2xl font-extrabold text-slate-800">Presensi Wajah (Face ID)</h1>
    <div className="grid lg:grid-cols-2 gap-4"><div className="card p-4 space-y-3"><div className="text-xs text-slate-500">Kamera mengenali wajah murid secara otomatis, tanpa kartu. Pilih <b>Presensi Datang</b> (sebelum jam {db.school.jamMasuk||'07:30'} = Hadir, sesudahnya = Terlambat) atau <b>Presensi Pulang</b> (hanya untuk murid yang sudah datang). Jam pulang sesuai kelas: {[...new Set(db.classes.map(k=>jpOf(db,k.id)))].sort().join(' / ')}. Mode otomatis berpindah ke Pulang saat jam pulang paling awal tiba. Murid yang sudah tercatat tidak diubah lagi.</div>
      <div className="flex gap-1 p-1 rounded-xl" style={{background:'#e2e8f0'}}>{[['masuk','Presensi Datang'],['pulang','Presensi Pulang']].map(([k,l])=><button key={k} className="flex-1 rounded-lg py-2 text-sm font-semibold" style={md===k?{background:k==='masuk'?'#2563eb':'#ea580c',color:'#fff'}:{color:'#475569'}} onClick={()=>setMd(k)}>{l}</button>)}</div>
      <div className="relative rounded-xl overflow-hidden bg-slate-900 flex items-center justify-center" style={{aspectRatio:'4/3'}}>{on?<><video ref={vid} autoPlay playsInline muted style={{width:'100%',height:'100%',objectFit:'cover',transform:fm==='user'?'scaleX(-1)':'none'}}/><canvas ref={ovl} style={{position:'absolute',inset:0,width:'100%',height:'100%',pointerEvents:'none'}}/>
        <div className="absolute top-2 left-2 flex items-center gap-1.5 text-white text-xs rounded-full px-2 py-1" style={{background:'rgba(0,0,0,.5)'}}><span className="animate-pulse inline-block rounded-full" style={{width:8,height:8,background:lib==='ready'?'#22c55e':'#f59e0b'}}/>{lib==='ready'?(md==='masuk'?'Datang':'Pulang')+' · mencari wajah...':'Memuat model...'}</div>
        {fb&&<div className="absolute inset-0 flex items-end justify-center p-3 text-white font-bold text-center" style={{border:'6px solid '+fb.c,background:fb.c+'40',pointerEvents:'none'}}><span className="rounded-lg px-3 py-1.5" style={{background:fb.c}}>{fb.msg}</span></div>}</>:<span className="text-slate-400 text-sm">Kamera mati</span>}</div>
      <div className="flex flex-wrap gap-2 items-center"><button className={'btn text-white '+(on?'bg-red-600':'bg-blue-600')} onClick={()=>setOn(!on)}><Ic n="cam"/>{on?'Matikan kamera':'Nyalakan kamera'}</button><button className="btn bg-slate-100" onClick={()=>setFm(fm==='user'?'environment':'user')}>Balik kamera ({fm==='user'?'depan':'belakang'})</button></div>
      <label className="flex items-center gap-2 text-xs text-slate-600"><input type="checkbox" checked={auto} onChange={setAutoP}/>Nyalakan kamera otomatis saat membuka menu ini</label>
      {lib!=='ready'&&<div className="text-sm rounded-lg p-2" style={{background:'#fef3c7',color:'#92400e'}}><FaceStatus lib={lib} retry={retry}/></div>}
      {st2&&lib==='ready'&&<div className="text-sm rounded-lg p-2" style={{background:'#f1f5f9'}}>{st2}</div>}
      <div className="text-xs text-slate-500"><b>{regd}</b> dari {tot} murid sudah terdaftar wajahnya.{regd<tot&&' Yang belum terdaftar: buka menu Pendaftaran Wajah, atau catat lewat NIS di bawah.'}</div>
      <div className="flex gap-2"><input className="inp flex-1" placeholder="Cadangan: ketik NIS manual" value={man} onChange={e=>setMan(e.target.value)} onKeyDown={e=>{if(e.key==='Enter')manual()}}/><button className="btn bg-blue-600 text-white" onClick={manual}>Catat</button></div></div>
    <div className="card p-4"><h3 className="font-bold text-sm mb-2">PRESENSI TERAKHIR</h3>{log.length?log.map((x,i)=><div key={i} className="flex items-center gap-2 py-1.5 text-sm border-b border-slate-100">{x.pl?<span style={{background:x.early?'#d97706':'#ea580c'}} className="rounded-full text-white text-xs px-2 py-0.5">{x.early?'Pulang awal':'Pulang'}</span>:<span style={{background:ST[x.st].c}} className="rounded-full text-white text-xs px-2 py-0.5">{ST[x.st].l}</span>}<b>{x.s.name}</b><span className="ml-auto text-slate-400 text-xs">{x.hm}</span></div>):<div className="text-sm text-slate-400">Belum ada presensi.</div>}</div></div></div>;
}

const PROMPT=['Lihat lurus ke kamera','Putar kepala sedikit ke kiri','Putar kepala sedikit ke kanan','Angkat dagu sedikit','Tersenyum, lihat lurus'];
function Enroll({s,all,onSave,onClose}){
  const [lib,retry]=useFaceLib();const [on,setOn]=useState(true);const [fm,setFm]=useState('user');const [ok,setOk]=useState(false);
  const [step,setStep]=useState(0);const [done,setDone]=useState(false);const [msg,setMsg]=useState('');const smp=useRef([]);
  const {vid,ready}=useCamera(on,fm,er=>{setMsg(camMsg(er));setOn(false)});
  useEffect(()=>{if(!ok||!ready||lib!=='ready')return;let stop=false,timer=0,since=0;
    const opts=new faceapi.TinyFaceDetectorOptions({inputSize:416,scoreThreshold:.6});
    const tick=async()=>{if(stop)return;const v=vid.current;let wait=150;
      try{if(v&&v.videoWidth&&v.readyState>=2){
        const res=await faceapi.detectAllFaces(v,opts).withFaceLandmarks().withFaceDescriptors();
        if(stop)return;const st=smp.current.length;
        if(res.length!==1){since=0;setMsg(res.length?'Hanya satu wajah yang boleh terlihat.':'Wajah belum terlihat. '+PROMPT[st])}
        else{const r=res[0];
          if(r.detection.box.width<v.videoWidth*.22){since=0;setMsg('Dekatkan wajah ke kamera.')}
          else{if(!since)since=Date.now();setMsg(PROMPT[st]+' — tahan sebentar');
            if(Date.now()-since>700){const prev=smp.current;
              if(prev.length&&Math.min(...prev.map(p=>fdist(p,r.descriptor)))>.55){since=0;setMsg('Wajah berbeda terdeteksi. Pastikan hanya murid ini di depan kamera.')}
              else{prev.push(r.descriptor);since=0;setStep(prev.length);wait=800;try{navigator.vibrate&&navigator.vibrate(40)}catch(e){}
                if(prev.length>=PROMPT.length){setDone(true);setMsg('Selesai. Periksa lalu simpan.');return}}}}}}
      }catch(e){}
      if(!stop)timer=setTimeout(tick,wait)};
    tick();return()=>{stop=true;clearTimeout(timer)}},[ok,ready,lib]);
  const save=()=>{const ds=smp.current;
    const dup=all.find(o=>o.id!==s.id&&parseFace(o.face).some(d=>ds.some(x=>fdist(x,d)<.4)));
    if(dup&&!confirm('Wajah ini sangat mirip dengan '+dup.name+'. Tetap simpan untuk '+s.name+'?'))return;
    onSave(serFace(ds))};
  return <div className="fixed inset-0 z-50 flex items-center justify-center p-4" style={{background:'rgba(15,23,42,.6)'}}><div className="card p-5 w-full max-w-md space-y-3 overflow-y-auto" style={{maxHeight:'95vh'}}>
    <div className="flex justify-between items-start"><div><h3 className="font-bold">Daftarkan wajah</h3><div className="text-sm text-slate-500">{s.name} · NIS {s.nis}</div></div><button type="button" onClick={onClose}><Ic n="x"/></button></div>
    <div className="relative rounded-xl overflow-hidden bg-slate-900 flex items-center justify-center" style={{aspectRatio:'4/3'}}>{on?<><video ref={vid} autoPlay playsInline muted style={{width:'100%',height:'100%',objectFit:'cover',transform:fm==='user'?'scaleX(-1)':'none'}}/>
      <div style={{position:'absolute',height:'78%',aspectRatio:'3/4',border:'3px dashed '+(done?'#22c55e':'rgba(255,255,255,.7)'),borderRadius:'50%',pointerEvents:'none'}}/></>:<span className="text-slate-400 text-sm">Kamera mati</span>}</div>
    <div className="flex gap-1.5 justify-center">{PROMPT.map((p,i)=><span key={i} style={{width:28,height:6,borderRadius:3,background:i<step?'#22c55e':'#e2e8f0'}}/>)}</div>
    {lib!=='ready'&&<div className="text-sm rounded-lg p-2" style={{background:'#fef3c7',color:'#92400e'}}><FaceStatus lib={lib} retry={retry}/></div>}
    {ok&&msg&&<div className="text-sm rounded-lg p-2 text-center" style={{background:done?'#dcfce7':'#f1f5f9'}}>{msg}</div>}
    {!ok&&<><label className="text-xs flex items-start gap-2"><input type="checkbox" className="mt-0.5" onChange={e=>setOk(e.target.checked&&true)}/><span>Orang tua/wali murid sudah menyetujui pendaftaran wajah ini. Data disimpan sebagai kode angka (bukan foto) dan hanya dipakai untuk presensi.</span></label><div className="text-xs text-slate-500">Centang persetujuan untuk memulai. Kamera akan merekam 5 sampel otomatis.</div></>}
    <div className="flex gap-2 flex-wrap"><button className="btn bg-slate-100" onClick={()=>setFm(fm==='user'?'environment':'user')}>Balik kamera</button>

function ImportBar({imp}){
  const [busy,setBusy]=useState(false);const [keep,setKeep]=useState(true);
  const onFile=async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;setBusy(true);
    try{const wb=XLSX.read(await f.arrayBuffer(),{type:'array',codepage:65001});const rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:'',raw:false});imp.run(rows,keep)}catch(err){imp.toast('File tidak dapat dibaca. Gunakan .xlsx, .xls, atau .csv.')}setBusy(false)};
  const tpl=async()=>{const ws=XLSX.utils.aoa_to_sheet(imp.tpl);ws['!cols']=imp.tpl[0].map(h=>({wch:Math.max(16,h.length+6)}));const wp=XLSX.utils.aoa_to_sheet([['Kolom','Keterangan'],...imp.tpl[0].map(h=>[h,imp.req.includes(h)?'Wajib diisi':'Opsional'])]);wp['!cols']=[{wch:16},{wch:16}];const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'Template');XLSX.utils.book_append_sheet(wb,wp,'Petunjuk');const xl=XLSX.write(wb,{bookType:'xlsx',type:'array'});
    try{await saveFile(imp.file.replace(/\.csv$/,'.xlsx'),new Blob([xl],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}))}catch(e){if(!e||e.code!=='declined')imp.toast('Gagal mengunduh template.')}};
  return <div className="card p-4 flex flex-wrap items-center gap-3 noprint"><div className="text-sm flex-1" style={{minWidth:220}}><b>Impor dari file</b><div className="text-xs text-slate-500">Unggah .xlsx / .xls / .csv (baris pertama = judul kolom). Data dengan {imp.key} yang sama dilewati atau diperbarui sesuai pilihan di bawah. Kolom bertanda <b className="text-red-600">*</b> wajib diisi.</div><label className="text-xs flex items-center gap-1 mt-1"><input type="checkbox" checked={keep} onChange={e=>setKeep(e.target.checked)}/>Jangan ubah data yang sudah ada (hanya tambah data baru)</label></div><label className="btn bg-emerald-600 text-white"><Ic n="dl"/>{busy?'Membaca...':'Unggah file'}<input type="file" accept=".xlsx,.xls,.csv" className="hidden" onChange={onFile}/></label><button className="btn bg-slate-100" onClick={tpl}>Unduh template Excel</button><div className="w-full overflow-x-auto"><div className="text-xs font-semibold text-slate-600 mb-1">Contoh format file (judul kolom ada di baris pertama):</div><table className="w-full"><thead><tr>{imp.tpl[0].map(h=><th key={h}>{h}{imp.req.includes(h)&&<span style={{color:'#fca5a5'}}> *</span>}</th>)}</tr></thead><tbody>{imp.tpl.slice(1).map((r,i)=><tr key={i}>{r.map((c,j)=><td key={j}>{c}</td>)}</tr>)}</tbody></table></div></div>;
}

    else{const ids=new Set(ss.map(s=>s.id)),m=date.slice(0,7);Object.keys(db.att).forEach(k=>{const i=k.indexOf('|');if(k.slice(0,7)===m&&ids.has(k.slice(i+1))&&x[db.att[k]]!==undefined)x[db.att[k]]++})}

const CLOUD_URL_DEFAULT='https://presensi-ambelang-default-rtdb.asia-southeast1.firebasedatabase.app';
const cloudUrl=()=>{let u=CLOUD_URL_DEFAULT;try{u=u||localStorage.getItem('sdn_cloud_url')||''}catch(e){}return String(u).trim().replace(/\/+$/,'')};
const FB_API_KEY='AIzaSyBp9GqxofCv-CXBn9yB_D8FbALbMqHW89c';   // Web API Key (Firebase > Project settings > General)

const AUTHK='sdn_auth';
async function fbCall(ep,body){const r=await fetch('https://identitytoolkit.googleapis.com/v1/accounts:'+ep+'?key='+FB_API_KEY,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const j=await r.json();if(!r.ok)throw new Error((j.error&&j.error.message)||'ERR');return j}
async function fbRefresh(rt){const r=await fetch('https://securetoken.googleapis.com/v1/token?key='+FB_API_KEY,{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:'grant_type=refresh_token&refresh_token='+encodeURIComponent(rt)});const j=await r.json();if(!r.ok)throw new Error((j.error&&j.error.message)||'ERR');return{token:j.id_token,rt:j.refresh_token}}
const saveAuth=a=>{try{a?localStorage.setItem(AUTHK,JSON.stringify({rt:a.rt,email:a.email})):localStorage.removeItem(AUTHK)}catch(e){}};
const CCOL=['classes','teachers','students'];
const isO=v=>v&&typeof v==='object'&&!Array.isArray(v);
function toTree(d){const t={school:d.school||{},att:d.att||{},wa:d.wa||{},jam:d.jam||{}};
  CCOL.forEach(c=>{t[c]={};(d[c]||[]).forEach((x,i)=>{const {pass,user,...y}=x;t[c][x.id]={...y,_i:i}})});return t}
function fromTree(t){t=t||{};const d={school:t.school||{},att:t.att||{},wa:t.wa||{},jam:t.jam||{}};
  CCOL.forEach(c=>{d[c]=Object.values(t[c]||{}).sort((a,b)=>(a._i??1e9)-(b._i??1e9)||String(a.id).localeCompare(String(b.id))).map(x=>{const y={...x};delete y._i;return y})});return d}
function diff(a,b,p,out){out=out||{};p=p||'';
  const ks=new Set([...Object.keys(isO(a)?a:{}),...Object.keys(isO(b)?b:{})]);
  ks.forEach(k=>{const x=isO(a)?a[k]:undefined,y=isO(b)?b[k]:undefined,q=p?p+'/'+k:k;
    if(isO(x)&&isO(y))diff(x,y,q,out);
    else if(isO(x)||isO(y)){out[q]=y===undefined?null:y}
    else if(x!==y)out[q]=y===undefined?null:y});return out}
function setAt(obj,parts,val){if(!parts.length)return val;const o=isO(obj)?{...obj}:{};const k=parts[0];const nv=setAt(o[k],parts.slice(1),val);
  if(nv===null||nv===undefined)delete o[k];else o[k]=nv;return o}

function useCloud(db,setDb,toast,token){
  const url=cloudUrl();const Q=token?('?auth='+token):'';
  const [st,setSt]=useState(url?'connecting':'off');
  const R=useRef({last:{},remote:{},pend:0,dirty:false,failed:false,db,timer:null,ready:false});
  R.current.db=db;
  const flush=async()=>{const r=R.current;if(!url||!r.ready)return;
    const cur=toTree(r.db);const out=diff(r.last,cur);if(!Object.keys(out).length)return;
    r.pend++;
    try{const res=await fetch(url+'/.json'+Q,{method:'PATCH',body:JSON.stringify(out)});if(!res.ok)throw new Error(res.status);
      r.last=cur;r.failed=false;setSt('online')}
    catch(e){r.failed=true;setSt('error');clearTimeout(r.timer);r.timer=setTimeout(flush,5000)}
    finally{r.pend--;if(!r.pend&&r.dirty&&!r.failed){r.dirty=false;apply()}}};
  const apply=()=>{const r=R.current;
    if(r.pend){r.dirty=true;return}
    if(Object.keys(diff(r.last,toTree(r.db))).length){r.dirty=true;flush();return}
    const d=mig(fromTree(r.remote));r.last=toTree(d);
    if(Object.keys(diff(toTree(r.db),r.last)).length)setDb(d)};
  const forcePush=async()=>{const r=R.current;if(!url)return false;
    try{const t=toTree(r.db);const res=await fetch(url+'/.json'+Q,{method:'PATCH',body:JSON.stringify(t)});if(!res.ok)throw 0;r.last=t;r.remote=t;r.ready=true;setSt('online');return true}catch(e){setSt('error');return false}};
  useEffect(()=>{if(!url||!token)return;const r=R.current;let es;
    const onData=(path,data,merge)=>{
      const parts=String(path||'/').split('/').filter(Boolean);
      if(merge){Object.keys(data||{}).forEach(k=>{r.remote=setAt(r.remote,[...parts,...k.split('/')],data[k])})}
      else r.remote=parts.length?setAt(r.remote,parts,data):(data||{});
      if(!r.ready){
        if(data===null&&!parts.length){r.ready=true;r.remote={};forcePush().then(ok=>ok&&toast('Data perangkat ini diunggah ke cloud.'))}
        else{r.ready=true;r.last={};apply();setSt('online');toast('Data tersinkron dari cloud.')}
        return}
      clearTimeout(r.deb);r.deb=setTimeout(apply,120)};
    try{es=new EventSource(url+'/.json'+Q);
      es.onopen=()=>{if(!r.failed)setSt('online')};
      es.onerror=()=>setSt('error');
      es.addEventListener('put',e=>{try{const m=JSON.parse(e.data);onData(m.path,m.data,false)}catch(x){}});
      es.addEventListener('patch',e=>{try{const m=JSON.parse(e.data);onData(m.path,m.data,true)}catch(x){}});
      es.addEventListener('cancel',()=>setSt('error'));
      es.addEventListener('auth_revoked',()=>setSt('error'))}catch(e){setSt('error')}
    const onOn=()=>{flush()};window.addEventListener('online',onOn);
    return()=>{es&&es.close();window.removeEventListener('online',onOn);clearTimeout(r.timer);clearTimeout(r.deb)}},[url,token]);
  useEffect(()=>{flush()},[db]);
  return{status:st,url,forcePush,enabled:!!url}}

const CLOUD_L={off:['Mode lokal','#94a3b8'],connecting:['Menghubungkan…','#f59e0b'],online:['Tersinkron','#22c55e'],error:['Terputus (dikirim ulang otomatis)','#ef4444']};
const CloudDot=({cloud})=>{const [l,c]=CLOUD_L[cloud.status]||CLOUD_L.off;return <span className="inline-flex items-center gap-1.5 text-[11px]" title="Status sinkronisasi cloud"><span style={{width:8,height:8,borderRadius:99,background:c,display:'inline-block'}}/>{l}</span>};
function CloudCard({cloud,toast}){
  const [u,setU]=useState(()=>{try{return localStorage.getItem('sdn_cloud_url')||''}catch(e){return ''}});const [bz,setBz]=useState(false);
  const fixed=!!CLOUD_URL_DEFAULT;
  const saveUrl=()=>{const v=u.trim().replace(/\/+$/,'');if(v&&!/^https:\/\/.+/.test(v))return toast('Alamat harus diawali https://');
    try{if(v)localStorage.setItem('sdn_cloud_url',v);else localStorage.removeItem('sdn_cloud_url')}catch(e){}
    toast('Tersimpan. Memuat ulang…');setTimeout(()=>location.reload(),700)};
  const push=async()=>{if(!confirm('Data di cloud akan DITIMPA dengan data di perangkat ini. Lanjutkan?'))return;setBz(true);const ok=await cloud.forcePush();setBz(false);toast(ok?'Data perangkat ini kini menjadi data cloud.':'Gagal mengunggah. Periksa alamat database.')};
  return <div className="card p-5 space-y-3"><div className="flex items-center justify-between gap-2 flex-wrap"><h2 className="font-bold">Sinkronisasi Cloud (antar perangkat)</h2><CloudDot cloud={cloud}/></div>

    {!fixed&&<div className="flex gap-2 flex-wrap"><input className="inp flex-1" style={{minWidth:220}} placeholder="https://nama-proyek-default-rtdb.firebaseio.com" value={u} onChange={e=>setU(e.target.value)}/><button className="btn bg-blue-600 text-white" onClick={saveUrl}>Simpan & hubungkan</button></div>}
    {cloud.enabled&&<button className="btn bg-amber-50 text-amber-700" disabled={bz} onClick={push}>{bz?'Mengunggah…':'Unggah data perangkat ini ke cloud (timpa)'}</button>}</div>}
